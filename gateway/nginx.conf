# =============================================================================
# Gateway - local stand-in for Azure API Management (see apim/policy.xml)
#
# Does what APIM does in the target architecture, in miniature:
#   * subscription key per client (Ocp-Apim-Subscription-Key) -> 401 without one
#   * maps the key to a client identity and injects it for DAB as an App
#     Service principal (X-MS-CLIENT-PRINCIPAL). Whatever principal the caller
#     sends is overwritten, so it cannot be spoofed from outside.
#   * read-only surface: GET on /api, POST only on /graphql
#   * per-client rate limit, short per-client cache, JSON audit log
#   * serves the portal on the same origin
# DAB itself is not published by docker compose; this is the only door.
# =============================================================================

# key -> client code (audit + rate-limit key)
map $http_ocp_apim_subscription_key $cip_client {
    default             "";
    "cl01-demo-7f3a9c"  "CL01";
    "cl02-demo-41be07"  "CL02";
}

# key -> base64 App Service principal: claims name, roles=client_reader, client_code
map $http_ocp_apim_subscription_key $cip_principal {
    default             "";
    "cl01-demo-7f3a9c"  "eyJhdXRoX3R5cCI6ImFhZCIsIm5hbWVfdHlwIjoibmFtZSIsInJvbGVfdHlwIjoicm9sZXMiLCJjbGFpbXMiOlt7InR5cCI6Im5hbWUiLCJ2YWwiOiJjbDAxLnZpZXdlckBwb3J0YWwuZGVtbyJ9LHsidHlwIjoicm9sZXMiLCJ2YWwiOiJjbGllbnRfcmVhZGVyIn0seyJ0eXAiOiJjbGllbnRfY29kZSIsInZhbCI6IkNMMDEifV19";
    "cl02-demo-41be07"  "eyJhdXRoX3R5cCI6ImFhZCIsIm5hbWVfdHlwIjoibmFtZSIsInJvbGVfdHlwIjoicm9sZXMiLCJjbGFpbXMiOlt7InR5cCI6Im5hbWUiLCJ2YWwiOiJjbDAyLnZpZXdlckBwb3J0YWwuZGVtbyJ9LHsidHlwIjoicm9sZXMiLCJ2YWwiOiJjbGllbnRfcmVhZGVyIn0seyJ0eXAiOiJjbGllbnRfY29kZSIsInZhbCI6IkNMMDIifV19";
}

# Local demos may call in from another origin (e.g. the published console).
# APIM pins an explicit origin list in Azure.
map $http_origin $cors_origin {
    default       "";
    "~^https?://" $http_origin;
}

limit_req_zone $cip_client zone=per_client:10m rate=20r/s;
proxy_cache_path /var/cache/nginx/cip levels=1:2 keys_zone=cip:10m max_size=50m inactive=1m use_temp_path=off;

log_format cip_audit escape=json
    '{"time":"$time_iso8601","client":"$cip_client","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"ms":$request_time,'
    '"upstream_ms":"$upstream_response_time","cache":"$upstream_cache_status"}';

upstream dab {
    server dab:5000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout cip_audit;

    # ---- portal (static) ---------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Served from here, not from disk: tells the portal to use the live path.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        return 200 "window.CIP_CONFIG = { mode: 'live', base: '' };\n";
    }

    location = /gateway/health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # ---- REST: GET only ------------------------------------------------------
    location /api/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Headers "Ocp-Apim-Subscription-Key, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Expose-Headers "X-Cache" always;
        add_header X-Cache $upstream_cache_status always;

        if ($request_method = OPTIONS) { return 204; }
        if ($cip_client = "") {
            return 401 '{"statusCode":401,"message":"Access denied due to missing or invalid subscription key."}';
        }
        limit_except GET { deny all; }

        limit_req zone=per_client burst=40 nodelay;
        limit_req_status 429;

        proxy_cache cip;
        proxy_cache_key "$cip_client|$request_uri";
        proxy_cache_valid 200 2s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        include /etc/nginx/conf.d/dab-proxy.inc;
    }

    # ---- GraphQL: POST only --------------------------------------------------
    location = /graphql {
        default_type application/json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Headers "Ocp-Apim-Subscription-Key, Content-Type" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;

        if ($request_method = OPTIONS) { return 204; }
        if ($cip_client = "") {
            return 401 '{"statusCode":401,"message":"Access denied due to missing or invalid subscription key."}';
        }
        limit_except POST { deny all; }

        limit_req zone=per_client burst=40 nodelay;
        limit_req_status 429;

        include /etc/nginx/conf.d/dab-proxy.inc;
    }
}
