name: ReelBridge

on:
  push:
    paths:
      - "reelbridge/**"
      - ".github/workflows/reelbridge.yml"
  pull_request:
    paths:
      - "reelbridge/**"
  workflow_dispatch:

concurrency:
  group: reelbridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android – test, lint, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: reelbridge
    env:
      # Optional repository secrets. Without them the APK still builds; it shows "Setup required"
      # (no Firebase) and disables Facebook Login (no App ID). Nothing is ever faked.
      RB_FACEBOOK_APP_ID: ${{ secrets.RB_FACEBOOK_APP_ID }}
      RB_FACEBOOK_CLIENT_TOKEN: ${{ secrets.RB_FACEBOOK_CLIENT_TOKEN }}
      RB_FUNCTIONS_REGION: ${{ vars.RB_FUNCTIONS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Write google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
            echo "Firebase config: present"
          else
            echo "Firebase config: NOT configured (APK will show Setup required)"
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: reelbridge-apks
          path: |
            reelbridge/app/build/outputs/apk/debug/*.apk
            reelbridge/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reelbridge-reports
          path: |
            reelbridge/core/build/reports
            reelbridge/app/build/reports
          if-no-files-found: ignore

  android-device-tests:
    name: Android – instrumented tests on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        working-directory: reelbridge
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run instrumented tests (API 34 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: reelbridge
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reelbridge-device-test-reports
          path: reelbridge/app/build/reports/androidTests
          if-no-files-found: ignore

  backend:
    name: Backend – Cloud Functions build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reelbridge/backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  security-rules:
    name: Backend – Firestore & Storage rules (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reelbridge/backend/rules-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
